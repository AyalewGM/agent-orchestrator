name: Coordinator checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q director tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          export DB_PATH="$(mktemp -u).sqlite"
          python -m director.cli --db "$DB_PATH" init-mihur
          python -m director.cli --db "$DB_PATH" status
          python -m director.cli --db "$DB_PATH" claim --worker ci-smoke
